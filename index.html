<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.slideshow {
    position: relative;
    width: 100%;
    height: 100vh;
    cursor: none;
}

.slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.5s ease;
}

.slide.active {
    opacity: 1;
}

.arrow {
    position: fixed;
    pointer-events: none;
    transform: translate(-50%, -50%);
    font-size: 32px;
    line-height: 1;
    color: black;
    display: none;
    z-index: 10;
    font-family: Arial, sans-serif;
}

</style>
</head>

<body>

<div class="slideshow" id="slideshow">

    <img class="slide active" src="images/005.jpg">
    <img class="slide" src="images/011.jpg">
    <img class="slide" src="images/021.jpg">
    <img class="slide" src="images/031.jpg">

</div>

<div class="arrow" id="arrow"></div>

<script>

const slides = document.querySelectorAll(".slide");
const slideshow = document.getElementById("slideshow");
const arrow = document.getElementById("arrow");

let current = 0;

function showSlide(index) {

    slides[current].classList.remove("active");

    current = (index + slides.length) % slides.length;

    slides[current].classList.add("active");
}

slideshow.addEventListener("mousemove", function(event) {

    const rect = slideshow.getBoundingClientRect();
    const x = event.clientX - rect.left;

    arrow.style.left = event.clientX + "px";
    arrow.style.top = event.clientY + "px";
    arrow.style.display = "block";

    if (x < rect.width / 2) {
        arrow.textContent = "←";
    } else {
        arrow.textContent = "→";
    }

});

slideshow.addEventListener("mouseleave", function() {
    arrow.style.display = "none";
});

slideshow.addEventListener("click", function(event) {

    const rect = slideshow.getBoundingClientRect();
    const x = event.clientX - rect.left;

    if (x < rect.width / 2) {
        showSlide(current - 1);
    } else {
        showSlide(current + 1);
    }

});

</script>

</body>
</html>
